<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservas Riviera Maya</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="encabezado">
      <h1>Reservas Riviera Maya</h1>
      <p>Selecciona y calcula tu experiencia turística</p>
    </header>
    <main class="contenedor">
      <section class="controles" aria-label="Controles del catálogo">
        <input
          id="buscador"
          type="search"
          placeholder="Buscar experiencia..."
          aria-label="Buscar experiencia"
        />
        <select id="filtroCategoria" aria-label="Filtrar por categoría">
          <option value="todas">Todas las categorías</option>
          <option value="naturaleza">Naturaleza</option>
          <option value="cultura">Cultura</option>
          <option value="aventura">Aventura</option>
          <option value="gastronomia">Gastronomía</option>
          <option value="bienestar">Bienestar</option>
        </select>
        <select id="ordenPrecio" aria-label="Ordenar por precio">
          <option value="normal">Orden original</option>
          <option value="ascendente">Menor precio</option>
          <option value="descendente">Mayor precio</option>
        </select>
      </section>
      <div class="fila-precio">
        <label for="precioMaximo">Precio máximo (MXN):</label>
        <input id="precioMaximo" type="number" min="0" placeholder="Ej. 600" />
      </div>
      <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
      <p id="estado" class="estado">Cargando experiencias...</p>
      <section id="catalogo" class="catalogo"></section>
      <section class="resumen">
        <h2>Mi reservación</h2>
        <div id="listaReservas"><p>No hay experiencias seleccionadas.</p></div>
        <div class="resumen-datos">
          <p>Total de personas: <span id="totalPersonas">0</span></p>
          <p class="total">Total: <span id="total">$0 MXN</span></p>
        </div>
        <button id="botonVaciar" class="btn-vaciar" type="button">
          Vaciar reservación
        </button>
        <div id="cajaConfirmacion" class="confirmacion oculto">
          <p>¿Seguro que quieres borrar toda tu reservación?</p>
          <button id="botonSi" class="btn-si" type="button">Sí, vaciar</button>
          <button id="botonNo" class="btn-no" type="button">Cancelar</button>
        </div>
      </section>
    </main>
    <footer><p>Proyecto académico de frontend</p></footer>
  </body>
</html>
